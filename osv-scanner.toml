# GHSA-g3hv-75wg-m249 is fixed only in minimatch 11. The overrides in
# package.json move every minimatch 9 and 10 copy to 11, but @babel/cli's
# glob 7 needs minimatch 3 and jake's filelist needs minimatch 5, whose
# function-style API minimatch 11 no longer provides. Those two majors have no
# globParts preprocessing (firstPhasePreProcess), which is where the
# amplification happens, and both expand only patterns from this repository.
# Drop this entry once the build tools stop depending on them.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "Only minimatch 3 and 5 remain, which lack the vulnerable globParts preprocessing; dev-only build tools that expand this repository's patterns"
