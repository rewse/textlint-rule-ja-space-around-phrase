name: Dependency Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "36 11 * * 3"  # Every Wednesday at 20:36 JST (11:36 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-chain:
    name: Aikido Safe Chain Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Setup Aikido Safe Chain
        uses: rewse/actions/setup-safe-chain@f4009aabb158e08d02f739dce2ebf7aecd0a779f  # v1.1.1

      - name: Install dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

  osv-scan:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
