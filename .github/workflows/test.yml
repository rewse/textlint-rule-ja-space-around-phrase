name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Setup Aikido Safe Chain
        uses: rewse/actions/setup-safe-chain@f4009aabb158e08d02f739dce2ebf7aecd0a779f  # v1.1.1

      - name: Install dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
