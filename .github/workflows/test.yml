name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          check-latest: true
          node-version: '24'

      - name: Setup Aikido Safe Chain
        uses: rewse/actions/setup-safe-chain@90d01bd07cb0cb6f5fb1dcb89a01b3165bb50c2b  # v1.1.8

      - name: Install dependencies
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 96
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
